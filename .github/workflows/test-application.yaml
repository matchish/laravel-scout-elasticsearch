name: Test application

on:
    pull_request:
    push:
        branches:
            - master

jobs:
    php:
        name: 'Run tests with php ${{ matrix.php-version }} (${{ matrix.dependencies }} dependencies)'
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: '8.2'
                      dependencies: 'lowest'
                    - php-version: '8.2'
                      dependencies: 'highest'
                    - php-version: '8.3'
                      dependencies: 'highest'
                    - php-version: '8.4'
                      dependencies: 'highest'
                      coverage: true
                    - php-version: '8.5'
                      dependencies: 'highest'
        services:
            elasticsearch:
                image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
                ports:
                    - 9200:9200
                env:
                    discovery.type: 'single-node'
                    xpack.security.enabled: 'false'
                options: --health-cmd="curl http://localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=5
            mysql:
                image: mysql:5.7.22
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: unittest
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            -   name: Checkout project
                uses: actions/checkout@v4

            -   name: Install and configure PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
                    tools: 'composer'

            -   name: Get composer cache directory
                id: composer-cache-dir
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache dependencies
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache-dir.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
                    restore-keys: |
                        ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.dependencies }}-

            -   name: Install dependencies
                run: |
                    composer validate --strict
                    composer update --no-interaction --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

            -   name: Run tests
                run: vendor/bin/phpunit ${{ matrix.coverage && '--coverage-clover=coverage.xml' || '' }}
                env:
                    DB_DATABASE: unittest
                    DB_USERNAME: root
                    ELASTICSEARCH_HOST: '127.0.0.1:9200'

            -   name: Upload coverage results
                uses: actions/upload-artifact@v4
                if: matrix.coverage
                with:
                    name: coverage-report
                    path: coverage.xml
                    retention-days: 1
                    compression-level: 9
